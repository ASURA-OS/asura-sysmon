name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sysmon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: gofmt verification
        run: |
          drift="$(gofmt -l .)"
          if [ -n "$drift" ]; then
            echo "gofmt would change:"
            echo "$drift"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Run unit tests under race detector
        run: go test -v -count=1 -race ./...

      - name: Build binary
        run: make build

      - name: Smoke test CLI subcommands
        run: |
          ./bin/asura-sysmon --version
          ./bin/asura-sysmon stats --interval 50 | jq -e '.cpu.usagePercent >= 0'
          ./bin/asura-sysmon proc --limit 5 | jq -e '.processes | length > 0'
