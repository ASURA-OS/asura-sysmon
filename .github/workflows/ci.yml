name: ci

# Everything runs inside Void Linux (glibc), ASURA OS's base layer, with
# Void's own Go, so the checks see the same toolchain and /proc the OS ships.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sysmon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    container: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Install the toolchain from Void's repositories
        run: |
          xbps-install -Syu xbps
          xbps-install -Syu
          xbps-install -y go gcc make jq git

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Trust the checkout (the container runs as a different user)
        # Without this git reports "dubious ownership" and go build fails to
        # stamp version control information into the binary.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Go version
        run: go version

      - name: gofmt verification
        run: |
          drift="$(gofmt -l .)"
          if [ -n "$drift" ]; then
            echo "gofmt would change:"
            echo "$drift"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Run unit tests under race detector
        run: CGO_ENABLED=1 go test -v -count=1 -race ./...

      - name: Build binary
        run: make build

      - name: Smoke test CLI subcommands
        run: |
          ./bin/asura-sysmon --version
          ./bin/asura-sysmon stats --interval 50 | jq -e '.cpu.usagePercent >= 0'
          ./bin/asura-sysmon proc --limit 5 | jq -e '.processes | length > 0'
          # Per-process CPU usage is sampled and the cpu sort is accepted.
          ./bin/asura-sysmon proc --sort cpu --limit 0 --interval 100 | jq -e '.processes | length > 0 and (map(.cpuPercent >= 0) | all)'
          # A PID that does not exist is reported, not crashed on.
          if ./bin/asura-sysmon kill 4194301 2>err.txt; then exit 1; fi
          grep -q "already exited" err.txt
